[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "heterosplit"
description = "Leakage-safe entity-disjoint splits and audits for heterogeneous link-prediction datasets."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Zubair Qazi" }]
keywords = [
  "graph",
  "link-prediction",
  "pytorch-geometric",
  "data-splitting",
  "cold-start",
  "leakage",
  "gnn",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = ["numpy>=1.24"]
dynamic = ["version"]

[project.optional-dependencies]
# PyTorch Geometric integration is optional; the correctness core is pure Python + NumPy.
pyg = ["torch>=2.1", "torch-geometric>=2.5"]

[project.urls]
Homepage = "https://github.com/zubairqazi/heterosplit"
Repository = "https://github.com/zubairqazi/heterosplit"
Issues = "https://github.com/zubairqazi/heterosplit/issues"

[tool.hatch.version]
path = "src/heterosplit/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/heterosplit"]

# ---------------------------------------------------------------------------
# Development toolchain (installed by `uv sync`, not published as an extra).
# ---------------------------------------------------------------------------
[dependency-groups]
dev = [
  "ruff>=0.6",
  "mypy>=1.11",
  "pytest>=8",
  "pytest-cov>=5",
  "hypothesis>=6.100",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "PERF", "PIE"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802", "N803", "N806"]

[tool.mypy]
# Type-check against 3.12 semantics: numpy 2.x ships PEP 695 stubs that mypy only
# parses under >=3.12. Runtime support for 3.10+ is validated by the pytest matrix.
python_version = "3.12"
files = ["src"]
strict = true
warn_unused_configs = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["torch.*", "torch_geometric.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"

[tool.coverage.run]
source = ["heterosplit"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@overload",
]
