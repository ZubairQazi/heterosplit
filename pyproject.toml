[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "heterosplit"
description = "Leakage-safe entity-disjoint splits and audits for heterogeneous link-prediction datasets."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Zubair Qazi" }]
keywords = [
  "graph",
  "link-prediction",
  "pytorch-geometric",
  "data-splitting",
  "cold-start",
  "leakage",
  "gnn",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = ["numpy>=1.24"]
dynamic = ["version"]

[project.optional-dependencies]
# PyTorch Geometric integration is optional; the correctness core is pure Python + NumPy.
pyg = ["torch>=2.1", "torch-geometric>=2.5"]

[project.urls]
Homepage = "https://github.com/zubairqazi/heterosplit"
Repository = "https://github.com/zubairqazi/heterosplit"
Issues = "https://github.com/zubairqazi/heterosplit/issues"

[tool.hatch.version]
path = "src/heterosplit/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/heterosplit"]
